name: Build محمد الحموري 3.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=""

          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Checking ZIP: $f"

              if unzip -l "$f" | grep -q "settings.gradle.kts"; then
                ZIP_FILE="$f"
                break
              fi
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: لم يتم العثور على ZIP يحتوي على settings.gradle.kts"
            echo "ZIP files الموجودة:"
            ls -la *.zip 2>/dev/null || true
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \
            -name "settings.gradle.kts" \
            -not -path "*/.gradle/*" \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: لم يتم العثور على مجلد المشروع"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Build محمد الحموري APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building project..."
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "MohammadAlHamouri-3.0.1-debug.apk"

      - name: Upload محمد الحموري APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-3.0.1-APK
          path: MohammadAlHamouri-3.0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
