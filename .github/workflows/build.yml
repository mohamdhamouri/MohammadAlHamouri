name: Build Mohammad Al Hamouri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          echo "ZIP: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully"

      - name: Locate Android project
        run: |
          PROJECT_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            echo "Files found:"
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin plugin for AGP 9
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -print0 |
          while IFS= read -r -d '' file; do
            sed -i '/org\.jetbrains\.kotlin\.android/d' "$file"
          done

      - name: Fix Android theme
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d "app/src/main" ]; then
            find app/src/main -type f -name "*.xml" -print0 |
            while IFS= read -r -d '' file; do
              sed -i \
                's#@android:style/Theme.DeviceDefault.DayNight.NoActionBar#@android:style/Theme.Material.Light.NoActionBar#g' \
                "$file"

              sed -i \
                's#Theme.DeviceDefault.DayNight.NoActionBar#Theme.Material.Light.NoActionBar#g' \
                "$file"
            done
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
