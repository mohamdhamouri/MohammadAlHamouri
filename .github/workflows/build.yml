name: Build Mohammad Al Hamouri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          echo "ZIP: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            -name "settings.gradle.kts" -o -name "settings.gradle" \
            -print -quit | xargs dirname)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Kotlin plugin for AGP 9
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -type f \
            -name "build.gradle.kts" -o -name "build.gradle" \
            -print0 | while IFS= read -r -d '' file; do

            sed -i '/org\.jetbrains\.kotlin\.android/d' "$file"

          done

      - name: Fix Android theme
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find app/src/main -type f -name "*.xml" -print0 | while IFS= read -r -d '' file; do

            sed -i \
              's#@android:style/Theme.DeviceDefault.DayNight.NoActionBar#@android:style/Theme.Material.Light.NoActionBar#g' \
              "$file"

            sed -i \
              's#Theme.DeviceDefault.DayNight.NoActionBar#Theme
