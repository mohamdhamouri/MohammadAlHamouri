name: Build Mohammad Al Hamouri Core APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Core ZIP
        run: |
          echo "Files in repository:"
          ls -la

          ZIP_FILE="core102.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: core102.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted."
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Android project
        run: |
          SETTINGS=$(find extracted -type f -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Found project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Build Core APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :core:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."
          find extracted -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          APK=$(find extracted -type f -path "*/core/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Core APK was not found"
            echo "All APK files:"
            find extracted -type f -name "*.apk" -print
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" MohammadAlHamouri-Core.apk

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-Core-APK
          path: MohammadAlHamouri-Core.apk
          if-no-files-found: error
          retention-days: 7
