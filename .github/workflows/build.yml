name: Build Mohammad Al Hamouri Core APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Core project
        run: |
          echo "Searching for Core Gradle project..."
          SETTINGS=$(find . -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "SETTINGS=$SETTINGS"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Build Core APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :core:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find core/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Core APK was not found"
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/MohammadAlHamouri-Core.apk"

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-Core-APK
          path: MohammadAlHamouri-Core.apk
          if-no-files-found: error
          retention-days: 7
