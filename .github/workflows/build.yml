name: Build Mohammad Al Hamouri 3.6.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل ملفات المشروع من المستودع
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. قبول تراخيص Android SDK
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 5. التحقق من ملفات Gradle الأساسية
      - name: Check project files
        run: |
          echo "Checking Android project files..."

          if [ ! -f "settings.gradle.kts" ] &&
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) not found in repository root."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] &&
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] &&
             [ ! -f "build.gradle" ]; then
            echo "WARNING: Root build.gradle(.kts) not found."
            echo "The project must define its plugins in another valid way."
          fi

          echo "Project file check completed."

      # 6. تثبيت أدوات Android SDK المطلوبة
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      # 7. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. بناء التطبيق وإنشاء APK
      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle --version
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      # 9. التحقق من إنشاء APK
      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated."
            echo "Searching for generated APK files..."
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      # 10. تجهيز ملف APK للتنزيل
      - name: Prepare APK artifact
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            MohammadAlHamouri-v3.6.1-debug.apk

      # 11. رفع APK إلى GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-v3.6.1-APK
          path: MohammadAlHamouri-v3.6.1-debug.apk
          if-no-files-found: error
          retention-days: 7
