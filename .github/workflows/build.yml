name: Build Mohammad Al Hamouri 3.6.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          ZIP_FILE="MohammadAlHamouri-v3.6.1-integrated-source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo "Files available in repository:"
            ls -la
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          if [ ! -f "android-project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction."
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project extracted successfully."
          ls -la android-project

      - name: Prepare Gradle project
        working-directory: android-project
        run: |
          if [ ! -f "build.gradle.kts" ] &&
             [ ! -f "build.gradle" ]; then
            echo "ERROR: Root Gradle build file is missing."
            echo "A compatible root build.gradle.kts must be added."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper is not present."
            echo "The next step will use installed Gradle if available."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find android-project/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-v3.6.1-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
