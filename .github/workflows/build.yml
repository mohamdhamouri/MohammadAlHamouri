name: Build محمد الحموري Core

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract Core project
        run: |
          mkdir extracted
          unzip -q core103.zip -d extracted
          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -type f | head -100

      - name: Build Core APK
        working-directory: extracted
        run: |
          gradle :core:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        working-directory: extracted
        run: |
          set -euxo pipefail
          find . -type f -name "*.apk" -print
          APK="$(find core/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" ../MohammadAlHamouri-Core.apk

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-Core-APK
          path: MohammadAlHamouri-Core.apk
          if-no-files-found: error
          retention-days: 7
