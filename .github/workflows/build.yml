name: Build Mohammad Al Hamouri Core APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Find and extract Core ZIP
        run: |
          echo "======================================"
          echo "Searching for core102.zip..."
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "core102.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: core102.zip was not found!"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          find extracted -maxdepth 5 -type f -print | head -200


      - name: Locate Android project
        run: |
          echo "======================================"
          echo "Searching for Android project..."
          echo "======================================"

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project was not found!"

            find extracted -maxdepth 8 -type f -print | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Settings:"
          echo "$SETTINGS_FILE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          echo "======================================"
          echo "Installing Android SDK packages..."
          echo "======================================"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed."


      - name: Verify Core project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "CORE PROJECT"
          echo "======================================"

          pwd

          echo "Files:"
          find . -maxdepth 3 -type f -print | head -200

          echo "======================================"
          echo "Gradle:"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi


      - name: Build Core APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "BUILDING CORE APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew :core:assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle :core:assembleDebug \
              --no-daemon \
              --stacktrace
          fi


      - name: Find generated APK
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find extracted \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find extracted \
            -type f \
            -path "*/core/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Core-specific APK path not found."
            echo "Trying general APK search..."

            APK=$(find extracted \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: NO APK WAS GENERATED!"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      - name: Prepare APK
        run: |
          echo "Preparing final APK..."

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist!"
            exit 1
          fi

          cp "$APK" MohammadAlHamouri-Core.apk

          ls -lh MohammadAlHamouri-Core.apk


      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-Core-APK
          path: MohammadAlHamouri-Core.apk
          if-no-files-found: error
          retention-days: 7
