
name: Build Mohammad Al Hamouri 3.6.1 SDK 36

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source archive
        run: |
          ZIP_FILE="MohammadAlHamouri-v3.6.1-sdk36-build-fixed.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source archive not found: $ZIP_FILE"
            ls -la
            exit 1
          fi
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source
          test -f build-source/settings.gradle.kts
          test -f build-source/build.gradle.kts
          test -f build-source/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: build-source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="build-source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "ERROR: APK was not generated"; find build-source/app/build/outputs -type f 2>/dev/null || true; exit 1; }
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadAlHamouri-v3.6.1-APK
          path: build-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
